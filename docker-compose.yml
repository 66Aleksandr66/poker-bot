services:
  db:
    image: postgres:16-alpine
    container_name: poker_bot_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: poker_bot
    volumes:
      - poker_bot_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: poker_bot_app
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      - db
    ports:
      - "5000:5000"

volumes:
  poker_bot_pgdata:
